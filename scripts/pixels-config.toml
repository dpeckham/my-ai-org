# Shared pixels settings. Not a complete config on its own.
#
# host-setup.sh writes ~/.config/pixels/config.toml as `backend = "incus"`,
# an [incus] table pointing at the local socket and the `agents` project, and
# then this file verbatim.
#
# The `agents` project is restricted (no privileged containers, no host-path
# disks) and capped; host-setup.sh creates it.

[defaults]
image   = "debian/13"      # glibc; see README on Alpine/NixOS
cpu     = "4"
memory  = 4096             # MiB. The project's limits.memory counts this for
                           # every box, stopped or not -- see README.
network = "incusbr0"

[ssh]
user = "pixel"
key  = "~/.ssh/id_ed25519"

[provision]
enabled = true
# pixels' own devtools step is broken on the Incus backend in 0.6.2: it pushes
# /home/pixel/.config/mise/config.toml without creating the parent directory,
# the Incus file API will not create parents, and the resulting error is
# swallowed by `_ = err` in sandbox/incus/backend.go. That aborts provisioning
# before rc.local runs, so the container silently ends up with no pixel user
# and no sshd. base-setup.sh installs a richer toolchain anyway.
devtools = false

[network]
egress = "unrestricted"    # newbox.sh sets each box to `agent` unless told otherwise
# Added to the built-in `agent` preset, which already covers api.anthropic.com
# (all a token-authenticated claude needs), api.openai.com, GitHub and the
# package registries:
# - Debian mirrors: the preset has only Ubuntu's, so apt breaks on a Debian
#   box without them.
# - chatgpt.com and auth.openai.com: codex signed in with ChatGPT talks to
#   chatgpt.com and refreshes its login at auth.openai.com. Without them it
#   hangs on "Reconnecting... 5/5" (api.openai.com is the API-key path).
allow = [
  "deb.debian.org", "security.debian.org",
  "chatgpt.com", "auth.openai.com",
]
