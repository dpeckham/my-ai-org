# Shared pixels settings. Not a complete config on its own.
#
# host-setup.sh, laptop-setup.sh and paperclip-up.sh each write
# ~/.config/pixels/config.toml as `backend = "incus"`, an [incus] table saying
# how *that* caller reaches the daemon (local socket, or HTTPS with a client
# certificate), and then this file verbatim. Everything that should be the
# same no matter who creates a box lives here.
#
# Every caller targets the `agents` Incus project, which host-setup.sh creates
# restricted (no privileged containers, no host-path disks) and capped. That
# is what makes it safe to hand pixels to an agent.

[defaults]
image   = "debian/13"      # glibc; see README on Alpine/NixOS
cpu     = "4"
memory  = 4096             # MiB. The project's limits.memory counts this for
                           # every box, stopped or not -- see README.
network = "incusbr0"

[ssh]
user = "pixel"
key  = "~/.ssh/id_ed25519"

[provision]
enabled = true
# pixels' own devtools step is broken on the Incus backend in 0.6.2: it pushes
# /home/pixel/.config/mise/config.toml without creating the parent directory,
# the Incus file API will not create parents, and the resulting error is
# swallowed by `_ = err` in sandbox/incus/backend.go. That aborts provisioning
# before rc.local runs, so the container silently ends up with no pixel user
# and no sshd. base-setup.sh installs a richer toolchain anyway.
devtools = false

[network]
egress = "unrestricted"    # per-container: newbox.sh --egress agent
# The built-in `agent` preset allowlists archive.ubuntu.com / security.ubuntu.com
# but no Debian mirrors, so apt breaks on a Debian base under restricted egress.
# herdr.dev and t3.codes are the control planes' own update/pairing hosts and
# are not in the preset, so `herdr machine add` and t3 pairing fail without
# them (verified: both return 000 under the stock agent preset).
allow = [
  "deb.debian.org", "security.debian.org",
  "herdr.dev", "t3.codes",
]
